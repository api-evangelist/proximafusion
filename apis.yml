description: Proxima Fusion is a European fusion energy company headquartered in Munich,
  Germany, developing commercial fusion power plants based on quasi-isodynamic (QI)
  stellarator technology. Spun out of the Max Planck Institute for Plasma Physics,
  the company combines stellarator optimization, high-performance computational design,
  and high-temperature superconducting (HTS) magnet technology to build its Stellaris
  power plant concept. Proxima Fusion aims to deliver clean, safe, continuous baseload
  fusion energy, and is backed by investors including Balderton Capital. It currently
  publishes no public developer API, SDK, or API documentation.
